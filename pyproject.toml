[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hypercore-indexer"
version = "0.1.0"
description = "Batch ingestion of hyperdata-node output files into Iceberg"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

# src/ is the source root and its modules are top level (no package wrapper),
# so they are declared as py-modules and imported by name.
[tool.setuptools]
py-modules = [
  "buffer", "cli", "config", "contract", "ledger", "normalise", "pipeline",
  "sink", "version",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 90
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
